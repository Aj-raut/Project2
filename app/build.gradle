plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace 'com.ajinkya.cleantogether'
    compileSdk 35

    defaultConfig {
        applicationId "com.ajinkya.cleantogether"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "CLOUDINARY_CLOUD_NAME", "\"${localProperties['cloudinary.cloud_name'] ?: ''}\""
        buildConfigField "String", "CLOUDINARY_API_KEY", "\"${localProperties['cloudinary.api_key'] ?: ''}\""
        buildConfigField "String", "CLOUDINARY_API_SECRET", "\"${localProperties['cloudinary.api_secret'] ?: ''}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }


}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.animation.core.android
    implementation libs.firebase.auth
    implementation libs.firebase.storage
    implementation libs.play.services.location
    implementation libs.firebase.crashlytics.buildtools
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation platform(libs.firebase.bom)

    implementation libs.com.google.firebase.firebase.auth
    implementation libs.firebase.database
    implementation libs.google.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.appcompat.v1xx
    implementation libs.play.services.auth

    // Bottom Navigation
    implementation 'com.github.ibrahimsn98:SmoothBottomBar:1.7.9'

    // CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // CameraX
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime:2.7.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.7.0"
    implementation "androidx.lifecycle:lifecycle-process:2.7.0"

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.guava:guava:31.0.1-android'

    implementation 'com.cloudinary:cloudinary-android:2.3.1'
    implementation 'com.cloudinary:cloudinary-core:1.34.0'

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'


    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-appcheck-debug:17.1.1'

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.9.0'

    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    //implementation 'com.google.android.gms:play-services-auth-api-phone:20.7.0'
    implementation "com.google.android.gms:play-services-maps:19.1.0"

    implementation 'org.osmdroid:osmdroid-android:6.1.16'

    implementation platform('com.google.firebase:firebase-bom:32.7.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
}